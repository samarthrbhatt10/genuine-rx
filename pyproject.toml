[tool.poetry]
name = "genuine-rx"
version = "0.1.0"
description = "RPA-driven medicine price intelligence and generic-substitute recommendation platform for Indian patients."
authors = []
readme = "README.md"
packages = [
    { include = "api" },
    { include = "matching_engine" },
    { include = "rpa" },
]

[tool.poetry.dependencies]
python = "^3.11"

# --- API / Backend ---
fastapi          = "^0.110"
"uvicorn[standard]" = "^0.30"
sqlalchemy       = "^2.0"
"psycopg[binary]" = "^3.0"
alembic          = "^1.13"
redis            = "^5.0"

# --- OCR / Matching ---
rapidfuzz               = "^3.0"
pytesseract             = "^0.3"
opencv-python-headless  = "^4.0"

# --- Notifications / Scheduling ---
twilio       = "^9.0"
apscheduler  = "^3.10"

# --- Automation Layer ---
robotframework          = "^7.1"
rpaframework            = "^28.0"
robotframework-browser  = "^18.0"

[tool.poetry.group.dev.dependencies]
pytest       = "^8.0"
pytest-asyncio = "^0.23"
httpx        = "^0.27"   # async test client for FastAPI

[build-system]
requires      = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
